<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>HDY Performance Engine — Hors connexion</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial,sans-serif;padding:24px}.card{max-width:460px;background:#111113;border:1px solid #2b2b31;border-radius:22px;padding:24px}.mark{width:58px;height:58px;display:grid;place-items:center;background:#E31E24;border-radius:16px;font-weight:900;margin-bottom:24px}.muted{color:#a1a1aa;line-height:1.5}button{margin-top:16px;width:100%;height:48px;border:0;border-radius:12px;background:#E31E24;color:#fff;font-weight:900}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">HDY</div>
    <h1>Connexion indisponible</h1>
    <p class="muted">Pour protéger les données joueurs, les informations médicales, GPS et de monitoring ne sont pas enregistrées dans le cache hors connexion.</p>
    <p class="muted">Reconnectez-vous à Internet puis rechargez l’application.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
